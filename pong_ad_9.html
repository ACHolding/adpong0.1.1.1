<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat's Pong — Pixel Stadium</title><style>
:root{color-scheme:dark;--ink:#f5f2dc;--yellow:#ffe56a;--blue:#76f7ed;--pink:#ff7fa8}*{box-sizing:border-box}body{margin:0;background:#090d1d;color:var(--ink);font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.poster{width:min(920px,94vw);margin:28px auto;border:3px solid var(--yellow);border-radius:22px;background:radial-gradient(ellipse at 50% 25%,#273365,#0b1025 70%);box-shadow:0 0 55px #ffe56a33;overflow:hidden;position:relative;padding:26px 28px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;letter-spacing:.19em;font-size:.72rem;color:#c2c8ec;font-weight:800}.pill{border:1px solid #5e6b99;border-radius:40px;padding:8px 12px}h1{text-align:center;font-size:clamp(3rem,10vw,7rem);line-height:.95;letter-spacing:-.075em;margin:35px 0 10px;text-shadow:5px 6px #fa6395,10px 12px #3a2d70}h1 span{color:var(--yellow)}.sub{text-align:center;color:var(--blue);letter-spacing:.32em;font-weight:900;font-size:clamp(.75rem,2.5vw,1.15rem);margin-bottom:26px}.arena{border:4px solid #e8e7ff;position:relative;width:100%;aspect-ratio:16/8;background:linear-gradient(#ffffff0a 1px,transparent 1px),#060a18;background-size:100% 10%;box-shadow:inset 0 0 38px #6ef7ff18,0 0 20px #9b94ff44;border-radius:8px;overflow:hidden}.arena:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #ffffff55}.paddle{position:absolute;width:13px;height:24%;top:38%;border-radius:3px}.left{left:5%;background:var(--blue);box-shadow:0 0 20px var(--blue)}.right{right:5%;background:var(--pink);box-shadow:0 0 20px var(--pink)}.ball{position:absolute;width:16px;height:16px;background:var(--yellow);border-radius:50%;left:50%;top:50%;box-shadow:0 0 20px var(--yellow)}.score{position:absolute;top:10%;width:100%;display:flex;justify-content:center;gap:100px;font:900 clamp(1.5rem,5vw,3rem) monospace;color:#ffffffaa;z-index:1}.caption{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:24px 0 20px}.caption strong{font-size:clamp(1.2rem,3vw,2rem);line-height:1.1}.caption p{color:#bfc6e4;font-size:.95rem}.action{border:0;background:var(--yellow);color:#101225;padding:15px 25px;border-radius:9px;font-weight:1000;letter-spacing:.08em;cursor:pointer;box-shadow:5px 5px 0 #fa6395;white-space:nowrap}.action:hover{transform:translateY(-2px)}footer{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #ffffff33;padding-top:18px;color:#aeb8d6;font-size:.78rem}.running .left{animation:paddleL 2.3s ease-in-out infinite alternate}.running .right{animation:paddleR 2.1s ease-in-out infinite alternate}.running .ball{animation:ball 3.6s linear infinite alternate}@keyframes paddleL{from{top:8%}to{top:68%}}@keyframes paddleR{from{top:67%}to{top:9%}}@keyframes ball{0%{left:7%;top:17%}25%{left:78%;top:65%}50%{left:91%;top:24%}75%{left:18%;top:72%}100%{left:50%;top:45%}}@media(max-width:600px){.poster{padding:18px}.caption{flex-direction:column;align-items:flex-start}.action{width:100%}.top{letter-spacing:.06em}footer{flex-direction:column}.ball{width:10px;height:10px}}
</style></head><body><main class="poster"><div class="top"><span>AC HOLDINGS / TEAM FLAMES</span><span class="pill">ARCADE SERIES · 2026</span></div><h1>CAT'S<br><span>PONG.</span></h1><div class="sub">PIXEL STADIUM · ROUND NINE</div><div class="arena running" id="arena" aria-label="Animated Pong exhibition"><div class="score"><span id="s1">0</span><span id="s2">0</span></div><div class="paddle left"></div><div class="paddle right"></div><div class="ball"></div></div><div class="caption"><div><strong>THE COURT IS SMALL.<br>THE RIVALRY IS HUGE.</strong><p>Two paddles. One ball. Retro competition at its finest.</p></div><button class="action" id="action">PAUSE THE RALLY</button></div><footer><span>© AC Kondo 1999–2026</span><span>MEOW POWERED · YAN YAN OWO :3</span></footer></main><script>
const arena=document.getElementById('arena'),button=document.getElementById('action');let active=true;button.addEventListener('click',()=>{active=!active;arena.classList.toggle('running',active);for(const el of arena.querySelectorAll('.paddle,.ball'))el.style.animationPlayState=active?'running':'paused';button.textContent=active?'PAUSE THE RALLY':'RESUME THE RALLY'});let l=0,r=0;setInterval(()=>{if(!active)return;if(Math.random()<.5)document.getElementById('s1').textContent=++l;else document.getElementById('s2').textContent=++r;if(l>=9||r>=9){l=0;r=0;document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0'}},4500);
</script></body></html>
